<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成板 · LOOKSET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--ink:#1c1a16;--mute:#6f685c;--line:#ddd4c4;--card:#fffcf6;--olive:#2f3c2a;--olive2:#3d4d36}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC','Manrope',sans-serif;font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 80px}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}
.brand{font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:.04em;line-height:1}
.brand small{display:block;font-family:'Manrope',sans-serif;font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase;margin-top:6px}
.hint{color:var(--mute);font-size:12.5px;max-width:42ch;text-align:right}
.studio{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:28px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);padding:18px}
.modes{display:flex;border:1px solid var(--line);margin-bottom:14px}
.modes button{flex:1;border:0;background:transparent;padding:9px;cursor:pointer;color:var(--mute)}
.modes button.on{background:var(--olive);color:#f6f1e6}
label.k{display:block;font-size:11px;letter-spacing:.08em;color:var(--mute);margin:10px 0 6px;text-transform:uppercase}
textarea{width:100%;min-height:88px;border:1px solid var(--line);background:#fff;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.mini{border:1px solid var(--line);background:#fff;padding:5px 9px;cursor:pointer;font-size:12px}
.chips button.on{border-color:var(--olive);background:#e8eee4}
.go{width:100%;margin-top:14px;background:var(--olive);color:#f6f1e6;border:0;padding:12px;cursor:pointer;letter-spacing:.08em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=text],input[type=color]{width:100%;border:1px solid var(--line);background:#fff;padding:8px}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:320px;overflow:auto;margin-top:8px}
.tile{border:1px solid var(--line);padding:8px;cursor:pointer;background:#fff;display:flex;gap:8px;align-items:center}
.tile.on{border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.tile .sw{width:28px;height:28px;flex:0 0 28px;border:1px solid rgba(0,0,0,.12)}
.tile b{display:block;font-size:12px;font-weight:500}
.tile span{color:var(--mute);font-size:10.5px}
.add{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.board{width:min(100%,420px);aspect-ratio:4/5;background:var(--olive);color:#f3eee2;position:relative;overflow:hidden;margin:0 auto;box-shadow:0 18px 50px rgba(40,36,28,.18)}
.board .kicker{position:absolute;left:22px;top:20px;z-index:3;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.78}
.board .title{position:absolute;left:22px;top:38px;z-index:3;font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1;font-style:italic}
.board .sub{position:absolute;left:22px;top:78px;z-index:3;font-size:11px;letter-spacing:.08em;opacity:.75;max-width:70%}
.slot{position:absolute;overflow:hidden}
.swatchbar{position:absolute;left:18px;bottom:18px;z-index:4;display:flex}
.swatchbar i{width:28px;height:28px;display:block;border:1px solid rgba(255,255,255,.25)}
.meta{margin:14px auto 0;width:min(100%,420px);color:var(--mute);font-size:12.5px}
.meta b{color:var(--ink);font-weight:500}
.note{margin:6px 0}
.actions button{border:1px solid var(--line);background:#fff;padding:7px 10px;cursor:pointer;margin-right:6px}
@media(max-width:860px){.studio{grid-template-columns:1fr}.hint{text-align:left}}
</style></head>
<body>
<div class="wrap">
<div class="top"><div class="brand">成板<small>LOOKSET · for party stylists</small></div>
<div class="hint">勾库里的料，或写一句氛围。板按六层组。</div></div>
<div class="studio"><div class="panel">
<div class="modes"><button id="mVibe" class="on">用氛围生成</button><button id="mLib">从素材库勾选</button></div>
<label class="k">这场要什么感觉</label>
<textarea id="prompt" placeholder="珍珠纯爱婚礼，绸和白花，夜场蜡烛"></textarea>
<label class="k">短词</label><div class="chips" id="presets"></div>
<div class="row2" style="margin-top:12px"><div><label class="k">场合</label>
<select id="scene"><option value="dinner">长桌晚宴</option><option value="cocktail">鸡尾酒</option><option value="lunch">日间午餐</option><option value="ceremony">仪式</option></select></div>
<div><label class="k">光</label>
<select id="light"><option value="candle">蜡烛 1800K</option><option value="string" selected>暖灯串 2200K</option><option value="led">LED 4000K</option><option value="noon">正午 5600K</option></select></div></div>
<div class="row2"><div><label class="k">位置</label>
<select id="place"><option value="shade">户外遮阴</option><option value="ac">室内空调</option><option value="sun">直射日光</option></select></div>
<div><label class="k">时长</label><select id="hours"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></div></div>
<button class="go" id="btnGo">生成这块板</button>
<label class="k" style="margin-top:18px">素材库</label><div class="lib" id="lib"></div>
<div class="add"><label class="k">加一条到库</label>
<div class="row2"><input id="nName" type="text" placeholder="名称">
<select id="nLayer"><option value="field">场地布</option><option value="mass">体量</option><option value="focal">主视觉</option><option value="edge">收边</option><option value="light">光</option><option value="live">活物</option></select></div>
<div class="row2" style="margin-top:6px"><input id="nHex" type="color" value="#e8dcc4"><input id="nTags" type="text" placeholder="pearl,wedding"></div>
<button class="mini" id="btnAdd" style="margin-top:8px">写入库</button></div>
</div>
<div><div class="board" id="board"></div><div class="meta" id="meta"></div></div>
</div></div>
<script>
const LAY={field:'场地',mass:'体量',focal:'主视觉',edge:'收边',light:'光',live:'活物'};
const PRESETS=[{id:'pearl',zh:'珍珠纯爱',prompt:'pearl silk white florals'},{id:'coastal',zh:'海岸午餐',prompt:'coastal linen eucalyptus'},{id:'garden',zh:'花园下午茶',prompt:'garden sage blush'},{id:'noir',zh:'夜场黑金',prompt:'evening black gold'},{id:'native',zh:'本土干野',prompt:'banksia eucalyptus'},{id:'terracotta',zh:'赤陶日落',prompt:'terracotta sunset'}];
const BASE=[{id:'linen_sand',zh:'沙色亚麻',layer:'field',hex:'#e4d3b4',tags:['coastal','pearl','terracotta'],heat:4},{id:'linen_ivory',zh:'象牙亚麻',layer:'field',hex:'#efe6d0',tags:['pearl','garden'],heat:4},{id:'velvet_em',zh:'墨绿丝绒',layer:'field',hex:'#2f4a3a',tags:['noir'],heat:3},{id:'sage_cloth',zh:'鼠尾草绿布',layer:'field',hex:'#8b9a78',tags:['garden'],heat:4},{id:'silk_champ',zh:'香槟绸幕',layer:'mass',hex:'#e0c19a',tags:['pearl','noir'],heat:3},{id:'gauze',zh:'腮粉薄纱',layer:'mass',hex:'#e4b7be',tags:['garden','pearl'],heat:2},{id:'runner',zh:'赤陶桌旗',layer:'mass',hex:'#c46a45',tags:['terracotta','native'],heat:5},{id:'cake',zh:'珍珠蛋糕桌',layer:'focal',hex:'#f2eee6',tags:['pearl'],heat:3},{id:'backdrop',zh:'拍照墙',layer:'focal',hex:'#efe8d6',tags:['pearl','coastal','garden'],heat:4},{id:'arch_nat',zh:'本土拱门',layer:'focal',hex:'#c47a24',tags:['native','ceremony'],heat:5},{id:'plate',zh:'骨瓷金边盘',layer:'edge',hex:'#f0ead9',tags:['pearl','noir'],heat:5},{id:'stoneware',zh:'石瓷平盘',layer:'edge',hex:'#e6dcc0',tags:['coastal','garden','native'],heat:5},{id:'napkin',zh:'亚麻餐巾',layer:'edge',hex:'#efe8d6',tags:['pearl','coastal','garden'],heat:5},{id:'brass',zh:'做旧黄铜',layer:'edge',hex:'#b08a46',tags:['pearl','noir','terracotta'],heat:5},{id:'candle',zh:'长烛+罩',layer:'light',hex:'#e8dcc4',tags:['pearl','noir','garden'],heat:2},{id:'string',zh:'暖白灯串',layer:'light',hex:'#e0c19a',tags:['coastal','garden','pearl'],heat:5},{id:'white_sculp',zh:'白雕塑花',layer:'live',hex:'#f0ead9',tags:['pearl'],heat:2},{id:'euc',zh:'尤加利',layer:'live',hex:'#7d8b6e',tags:['coastal','native','garden','pearl'],heat:5},{id:'garden_mix',zh:'花园混合花',layer:'live',hex:'#d9a8ae',tags:['garden'],heat:2},{id:'banksia',zh:'班克木',layer:'live',hex:'#c47a24',tags:['native','terracotta'],heat:5},{id:'dark_fol',zh:'深叶主花',layer:'live',hex:'#2f4a3a',tags:['noir'],heat:4}];
const THEME={pearl:{ground:'#2f3c2a',kicker:'Wedding / styling inspiration',title:'Pearl pure love'},coastal:{ground:'#6e7c72',kicker:'Lunch / coastal styling',title:'Salt & linen'},garden:{ground:'#5d6a4e',kicker:'Garden / afternoon',title:'Gather slowly'},noir:{ground:'#161411',kicker:'Evening / cocktail',title:'After dark'},native:{ground:'#5a4632',kicker:'Native / dry heat',title:'Still standing'},terracotta:{ground:'#6a3b28',kicker:'Sunset / long table',title:'Clay hour'}};
let mode='vibe',selected=new Set(),custom=[];
const LS='lookset.v1';
const $=id=>document.getElementById(id);
function allLib(){return BASE.concat(custom)}
function save(){try{localStorage.setItem(LS,JSON.stringify({custom,selected:[...selected]}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');custom=d.custom||[];(d.selected||[]).forEach(id=>selected.add(id))}catch(e){}}
function detectTheme(t){t=(t||'').toLowerCase();if(/pearl|珍珠|纯爱|绸|silk|白花/.test(t))return 'pearl';if(/coast|海|沙|亚麻|euc/.test(t))return 'coastal';if(/garden|花园|blush|藤/.test(t))return 'garden';if(/noir|黑金|夜|墨绿/.test(t))return 'noir';if(/native|班克|本土|干/.test(t))return 'native';if(/terra|赤陶|日落/.test(t))return 'terracotta';return 'pearl'}
function hex2l(hex){const n=parseInt(hex.slice(1),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;return (Math.max(r,g,b)+Math.min(r,g,b))/2}
function hold(item,place){const kHeat={1:.2,2:.35,3:.55,4:.8,5:1}[item.heat||3];const kSun={ac:1.1,shade:.75,sun:.4}[place];return (item.heat>=5?16:item.heat>=4?10:item.heat>=3?7:4)*kHeat*kSun}
function compose(){
 const prompt=$('prompt').value.trim(),theme=detectTheme(prompt),place=$('place').value,hours=+$('hours').value,light=$('light').value,scene=$('scene').value;
 let picks; if(mode==='lib'&&selected.size) picks=allLib().filter(x=>selected.has(x.id)); else {picks=[];['field','mass','focal','edge','light','live'].forEach(layer=>{const cand=allLib().filter(x=>x.layer===layer&&(x.tags.includes(theme)||x.tags.includes(scene)||theme==='pearl'));const pool=cand.length?cand:allLib().filter(x=>x.layer===layer);pool.sort((a,b)=>(a.tags.includes(theme)?0:1)-(b.tags.includes(theme)?0:1)||(place==='sun'?b.heat-a.heat:0));if(pool[0])picks.push(pool[0]);if(layer==='edge'&&pool[1])picks.push(pool[1]);});}
 if(!picks.some(p=>p.layer==='field')){const f=allLib().find(x=>x.layer==='field');if(f)picks.unshift(f)}
 const ls=picks.map(p=>hex2l(p.hex)),spread=ls.length?Math.max(...ls)-Math.min(...ls):0;
 const holds=picks.map(p=>({p,h:hold(p,place)})).sort((a,b)=>a.h-b.h),weak=holds[0];
 let score=82; if(spread<.22)score-=16; if(weak&&weak.h<hours)score-=18; if(light==='led'&&picks.some(p=>/金|绸|silk/.test(p.zh+p.id)))score-=10; if(place==='sun'&&picks.some(p=>p.heat<=2))score-=12;
 const missing=['field','focal','live'].filter(l=>!picks.some(p=>p.layer===l)); score=Math.max(28,Math.min(96,score-missing.length*8));
 renderBoard({theme,picks,spread,weak,hours,light,prompt,score,missing});
}
function renderBoard(R){
 const th=THEME[R.theme]||THEME.pearl, title=R.prompt&&R.prompt.length<28?R.prompt:th.title;
 const slots=[{x:46,y:18,w:50,h:46},{x:8,y:42,w:42,h:34},{x:52,y:62,w:42,h:28},{x:8,y:74,w:38,h:18}];
 let html=`<div class="kicker">${th.kicker}</div><div class="title">${esc(title)}</div><div class="sub">${['field','mass','focal','edge','light','live'].filter(l=>R.picks.some(p=>p.layer===l)).map(l=>LAY[l]).join(' · ')}</div>`;
 slots.forEach((s,i)=>{const item=R.picks[i%R.picks.length];html+=`<div class="slot" style="left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%;background:${item?item.hex:'#333'}"><div style="position:absolute;left:8px;bottom:6px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px #000">${item?esc(item.zh):''}</div></div>`;});
 html+=`<div class="swatchbar">${R.picks.slice(0,5).map(p=>`<i style="background:${p.hex}"></i>`).join('')}</div>`;
 const el=$('board');el.style.background=th.ground;el.innerHTML=html;
 const notes=[]; if(R.spread<.22)notes.push('▲ 明度太近，四米外会糊。'); else notes.push('● 明度跨度够。');
 if(R.weak&&R.weak.h<R.hours)notes.push('▲ '+R.weak.p.zh+' 约 '+R.weak.h.toFixed(1)+' h，短于现场 '+R.hours+' h。'); else if(R.weak)notes.push('● 最弱的是 '+R.weak.p.zh+'，能撑过这场。');
 if(R.light==='led')notes.push('▲ 4000K LED 会把金和绸写脏。');
 if(R.missing.length)notes.push('▲ 缺层：'+R.missing.map(l=>LAY[l]).join('、'));
 notes.push('● 四米外先读到的是布和幕，不是花。');
 $('meta').innerHTML=`<div>结构分 <b>${R.score}</b> · ${R.picks.length} 件 · ${R.hours}h</div>${notes.map(n=>`<div class="note">${n}</div>`).join('')}<details style="margin-top:8px"><summary>这一板怎么组出来的</summary><p style="font-size:12px">先锁布和光，再补主视觉，最后才是花。</p></details><div class="actions" style="margin-top:10px"><button onclick="window.print()">打印</button><button id="btnAgain">换一套</button></div>`;
 $('btnAgain').onclick=()=>{BASE.push(BASE.shift());compose()};
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]))}
function drawLib(){$('lib').innerHTML=allLib().map(x=>`<div class="tile ${selected.has(x.id)?'on':''}" data-id="${x.id}"><span class="sw" style="background:${x.hex}"></span><div><b>${x.zh}</b><span>${LAY[x.layer]}</span></div></div>`).join('')}
function drawPresets(){$('presets').innerHTML=PRESETS.map(p=>`<button data-id="${p.id}">${p.zh}</button>`).join('')}
load();drawPresets();drawLib();
$('mVibe').onclick=()=>{mode='vibe';$('mVibe').classList.add('on');$('mLib').classList.remove('on')};
$('mLib').onclick=()=>{mode='lib';$('mLib').classList.add('on');$('mVibe').classList.remove('on')};
$('presets').onclick=e=>{const id=e.target.dataset.id;if(!id)return;const p=PRESETS.find(x=>x.id===id);$('prompt').value=p.zh+' — '+p.prompt;[...$('presets').children].forEach(b=>b.classList.toggle('on',b.dataset.id===id))};
$('lib').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;if(selected.has(t.dataset.id))selected.delete(t.dataset.id);else selected.add(t.dataset.id);save();drawLib()};
$('btnAdd').onclick=()=>{const zh=$('nName').value.trim();if(!zh)return;custom.push({id:'c'+Date.now(),zh,layer:$('nLayer').value,hex:$('nHex').value,tags:($('nTags').value||'').split(',').map(s=>s.trim()).filter(Boolean),heat:4});selected.add(custom.at(-1).id);save();drawLib();$('nName').value=''};
$('btnGo').onclick=compose;$('prompt').value='珍珠纯爱婚礼，绸和白花，夜场蜡烛';compose();
</script></body></html>
