<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成板 · LOOKSET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe8d8;--ink:#241f18;--mute:#7a7266;--line:#e0d6c4;--card:#fffaf1;--olive:#314033;--paper:#f7f1e4}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 500px at 80% -10%, #f7f0e0 0%, var(--bg) 55%);color:var(--ink);font-family:'Noto Sans SC','Manrope',sans-serif;font-size:14px;line-height:1.55}
button,input,textarea,select{font:inherit}
.page{max-width:1120px;margin:0 auto;padding:28px 22px 72px}
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:500;letter-spacing:.02em;line-height:.9}
.brand em{font-style:italic;color:#5d6a52}
.brand small{display:block;margin-top:8px;font-family:'Manrope',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-style:normal}
.lede{max-width:34ch;color:var(--mute);font-size:13px;text-align:right}
.studio{display:grid;grid-template-columns:340px minmax(0,1fr);gap:36px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);padding:20px 18px 18px}
.modes{display:grid;grid-template-columns:1fr 1fr;margin-bottom:16px;background:var(--paper);border:1px solid var(--line)}
.modes button{border:0;background:transparent;padding:10px 8px;cursor:pointer;color:var(--mute);font-size:12.5px}
.modes button.on{background:var(--olive);color:#f4efe4}
.k{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:12px 0 6px}
textarea{width:100%;min-height:78px;border:1px solid var(--line);background:#fff;padding:10px 12px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.ghost{border:1px solid var(--line);background:#fff;padding:6px 10px;cursor:pointer;font-size:12px}
.chips button.on{background:#ece6d4;border-color:#b7ae98}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=text],input[type=color]{width:100%;border:1px solid var(--line);background:#fff;padding:8px 9px}
.go{width:100%;margin-top:16px;border:0;background:var(--olive);color:#f6f1e6;padding:13px;cursor:pointer;letter-spacing:.16em;font-size:12px;text-transform:uppercase}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:280px;overflow:auto;margin-top:8px}
.tile{border:1px solid var(--line);background:#fff;padding:6px;cursor:pointer;display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center}
.tile.on{outline:1px solid var(--olive);border-color:var(--olive)}
.tile .sw{width:42px;height:42px;background-size:cover;background-position:center}
.tile b{display:block;font-size:12px;font-weight:500}
.tile span{color:var(--mute);font-size:10px}
.add{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.stage{display:flex;justify-content:center}
.frame{width:min(100%,440px)}
.board{width:100%;aspect-ratio:4/5;position:relative;overflow:hidden;color:#f3eee4;box-shadow:0 22px 60px rgba(40,36,22,.16)}
.board:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.1),transparent 26%,transparent 70%,rgba(0,0,0,.22))}
.kicker{position:absolute;left:26px;top:26px;z-index:4;font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.72}
.ttl{position:absolute;left:24px;top:44px;z-index:4;font-family:'Cormorant Garamond',serif;font-size:clamp(28px,6.4vw,40px);line-height:.95;font-style:italic;max-width:52%;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.sub{position:absolute;left:26px;top:118px;z-index:4;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;max-width:44%}
.slot{position:absolute;overflow:hidden;background:#1b1b16;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.slot img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.94) contrast(1.05)}
.swatches{position:absolute;left:22px;bottom:20px;z-index:4;display:flex;border:1px solid rgba(255,255,255,.18)}
.swatches i{width:26px;height:26px;display:block}
.legend{position:absolute;right:18px;bottom:18px;z-index:4;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.meta{margin-top:16px;color:var(--mute);font-size:13px}
.scoreline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;color:var(--ink)}
.scoreline b{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500}
.note{margin:5px 0}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{border:1px solid var(--line);background:#fff;padding:8px 12px;cursor:pointer}
@media(max-width:880px){.studio{grid-template-columns:1fr}.lede{text-align:left}}
@media print{.mast,.panel,.actions,details,.lede{display:none!important}.page{padding:0}.board{box-shadow:none}}
</style></head>
<body>
<div class="page">
<header class="mast">
  <div class="brand">成<em>板</em><small>Lookset · styling board</small></div>
  <p class="lede">写一句氛围，或勾库里的料。板按场地 / 幕 / 主视觉 / 餐具 / 光 / 花 六层组。</p>
</header>
<div class="studio">
<aside class="panel">
  <div class="modes"><button id="mVibe" class="on">用氛围</button><button id="mLib">从素材库</button></div>
  <label class="k">这场要什么感觉</label>
  <textarea id="prompt" placeholder="珍珠纯爱婚礼，只要绸和白花"></textarea>
  <label class="k">短词</label><div class="chips" id="presets"></div>
  <div class="row" style="margin-top:10px">
    <div><label class="k">场合</label><select id="scene"><option value="dinner">长桌晚宴</option><option value="cocktail">鸡尾酒</option><option value="lunch">日间午餐</option><option value="ceremony">仪式</option></select></div>
    <div><label class="k">光</label><select id="light"><option value="candle">蜡烛 1800K</option><option value="string" selected>暖灯串 2200K</option><option value="led">LED 4000K</option><option value="noon">正午 5600K</option></select></div>
  </div>
  <div class="row">
    <div><label class="k">位置</label><select id="place"><option value="shade">户外遮阴</option><option value="ac">室内空调</option><option value="sun">直射日光</option></select></div>
    <div><label class="k">时长</label><select id="hours"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></div>
  </div>
  <button class="go" id="btnGo">生成这块板</button>
  <label class="k" style="margin-top:18px">素材库</label>
  <div class="lib" id="lib"></div>
  <div class="add">
    <label class="k">加一条</label>
    <div class="row"><input id="nName" type="text" placeholder="名称"><select id="nLayer"><option value="field">场地布</option><option value="mass">幕</option><option value="focal">主视觉</option><option value="edge">收边</option><option value="light">光</option><option value="live">花</option></select></div>
    <div class="row" style="margin-top:6px"><input id="nHex" type="color" value="#e8dcc4"><input id="nTags" type="text" placeholder="pearl, wedding"></div>
    <button class="ghost" id="btnAdd" style="margin-top:8px">写入库</button>
  </div>
</aside>
<section class="stage"><div class="frame"><div class="board" id="board"></div><div class="meta" id="meta"></div></div></section>
</div></div>
<script>
const REMOTE={
  'pearl-cake':'https://images.unsplash.com/photo-1621303837174-89787a7d2398?auto=format&fit=crop&w=800&q=70',
  'pearl-silk':'https://images.unsplash.com/photo-1558171813-4c088753af8f?auto=format&fit=crop&w=800&q=70',
  'pearl-floral':'https://images.unsplash.com/photo-1490750967861-cefd1d3ba32f?auto=format&fit=crop&w=800&q=70',
  'pearl-table':'https://images.unsplash.com/photo-1478146896981-b80fe463c16d?auto=format&fit=crop&w=800&q=70',
  'coastal-table':'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=70',
  'garden-table':'https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?auto=format&fit=crop&w=900&q=70',
  'noir-table':'https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=900&q=70',
  'native-still':'https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=800&q=70'
};
function src(key){return key && REMOTE[key] ? REMOTE[key] : ''}
const LAY={field:'场地',mass:'幕',focal:'主视觉',edge:'收边',light:'光',live:'花'};
const PRESETS=[{id:'pearl',zh:'珍珠纯爱'},{id:'coastal',zh:'海岸午餐'},{id:'garden',zh:'花园下午茶'},{id:'noir',zh:'夜场黑金'},{id:'native',zh:'本土干野'},{id:'terracotta',zh:'赤陶日落'}];
const BASE=[
 {id:'linen_sand',zh:'沙色亚麻',layer:'field',hex:'#e4d3b4',tags:['coastal','pearl','terracotta'],heat:4,photo:null},
 {id:'linen_ivory',zh:'象牙亚麻',layer:'field',hex:'#efe6d0',tags:['pearl','garden'],heat:4,photo:null},
 {id:'velvet_em',zh:'墨绿丝绒',layer:'field',hex:'#2f4a3a',tags:['noir'],heat:3,photo:null},
 {id:'sage_cloth',zh:'鼠尾草绿布',layer:'field',hex:'#8b9a78',tags:['garden'],heat:4,photo:null},
 {id:'silk_champ',zh:'香槟绸幕',layer:'mass',hex:'#e0c19a',tags:['pearl','noir'],heat:3,photo:'pearl-silk'},
 {id:'gauze',zh:'腮粉薄纱',layer:'mass',hex:'#e4b7be',tags:['garden','pearl'],heat:2,photo:null},
 {id:'runner',zh:'赤陶桌旗',layer:'mass',hex:'#c46a45',tags:['terracotta','native'],heat:5,photo:null},
 {id:'cake',zh:'珍珠蛋糕',layer:'focal',hex:'#f2eee6',tags:['pearl'],heat:3,photo:'pearl-cake'},
 {id:'backdrop',zh:'拍照墙',layer:'focal',hex:'#efe8d6',tags:['pearl','coastal','garden'],heat:4,photo:'pearl-silk'},
 {id:'arch_nat',zh:'本土拱门',layer:'focal',hex:'#c47a24',tags:['native','ceremony'],heat:5,photo:'native-still'},
 {id:'plate',zh:'骨瓷金边盘',layer:'edge',hex:'#f0ead9',tags:['pearl','noir'],heat:5,photo:'pearl-table'},
 {id:'stoneware',zh:'石瓷平盘',layer:'edge',hex:'#e6dcc0',tags:['coastal','garden','native'],heat:5,photo:'coastal-table'},
 {id:'napkin',zh:'亚麻餐巾',layer:'edge',hex:'#efe8d6',tags:['pearl','coastal','garden'],heat:5,photo:null},
 {id:'brass',zh:'做旧黄铜',layer:'edge',hex:'#b08a46',tags:['pearl','noir','terracotta','coastal'],heat:5,photo:null},
 {id:'candle',zh:'长烛+罩',layer:'light',hex:'#e8dcc4',tags:['pearl','noir','garden'],heat:2,photo:null},
 {id:'string',zh:'暖白灯串',layer:'light',hex:'#e0c19a',tags:['coastal','garden','pearl'],heat:5,photo:null},
 {id:'white_sculp',zh:'白雕塑花',layer:'live',hex:'#f0ead9',tags:['pearl'],heat:2,photo:'pearl-floral'},
 {id:'euc',zh:'尤加利',layer:'live',hex:'#7d8b6e',tags:['coastal','native','garden','pearl'],heat:5,photo:null},
 {id:'garden_mix',zh:'花园混合花',layer:'live',hex:'#d9a8ae',tags:['garden'],heat:2,photo:'garden-table'},
 {id:'banksia',zh:'班克木',layer:'live',hex:'#c47a24',tags:['native','terracotta'],heat:5,photo:'native-still'},
 {id:'dark_fol',zh:'深叶主花',layer:'live',hex:'#2f4a3a',tags:['noir'],heat:4,photo:'noir-table'}
];
const THEME={
 pearl:{ground:'#314033',kicker:'Wedding / styling inspiration',title:'Pearl pure love',photos:['pearl-cake','pearl-silk','pearl-floral','pearl-table']},
 coastal:{ground:'#6d7a70',kicker:'Lunch / coastal styling',title:'Salt & linen',photos:['coastal-table','pearl-silk','pearl-floral','pearl-table']},
 garden:{ground:'#5a6750',kicker:'Garden / afternoon',title:'Gather slowly',photos:['garden-table','pearl-floral','pearl-silk','pearl-table']},
 noir:{ground:'#161411',kicker:'Evening / cocktail',title:'After dark',photos:['noir-table','pearl-silk','pearl-floral','pearl-cake']},
 native:{ground:'#5a4632',kicker:'Native / dry heat',title:'Still standing',photos:['native-still','coastal-table','pearl-silk','pearl-table']},
 terracotta:{ground:'#6a3b28',kicker:'Sunset / long table',title:'Clay hour',photos:['native-still','garden-table','pearl-table','pearl-silk']}
};
const SLOTS=[{x:48,y:8,w:48,h:54},{x:6,y:38,w:44,h:36},{x:50,y:64,w:46,h:30},{x:8,y:78,w:36,h:16}];
let mode='vibe',selected=new Set(),custom=[];
const LS='lookset.v2';
const $=id=>document.getElementById(id);
function allLib(){return BASE.concat(custom)}
function save(){try{localStorage.setItem(LS,JSON.stringify({custom,selected:[...selected]}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');custom=d.custom||[];(d.selected||[]).forEach(id=>selected.add(id))}catch(e){}}
function detectTheme(t){t=(t||'').toLowerCase();if(/pearl|珍珠|纯爱|绸|silk|白花/.test(t))return 'pearl';if(/coast|海|沙|亚麻|euc|盐/.test(t))return 'coastal';if(/garden|花园|blush|藤/.test(t))return 'garden';if(/noir|黑金|夜|emerald|墨绿/.test(t))return 'noir';if(/native|班克|本土|干/.test(t))return 'native';if(/terra|赤陶|日落|柑橘/.test(t))return 'terracotta';return 'pearl'}
function hex2l(hex){const n=parseInt((hex||'#888').slice(1),16),r=((n>>16)&255)/255,g=((n>>8)&255)/255,b=(n&255)/255;return (Math.max(r,g,b)+Math.min(r,g,b))/2}
function hold(item,place){const kHeat={1:.2,2:.35,3:.55,4:.8,5:1}[item.heat||3];const kSun={ac:1.1,shade:.75,sun:.4}[place];return (item.heat>=5?16:item.heat>=4?10:item.heat>=3?7:4)*kHeat*kSun}
function compose(){
 const prompt=$('prompt').value.trim(),theme=detectTheme(prompt),place=$('place').value,hours=+$('hours').value,light=$('light').value,scene=$('scene').value;
 let picks; if(mode==='lib'&&selected.size) picks=allLib().filter(x=>selected.has(x.id));
 else {picks=[];['field','mass','focal','edge','light','live'].forEach(layer=>{const cand=allLib().filter(x=>x.layer===layer&&(x.tags.includes(theme)||x.tags.includes(scene)));const pool=(cand.length?cand:allLib().filter(x=>x.layer===layer)).slice();pool.sort((a,b)=>(a.tags.includes(theme)?0:1)-(b.tags.includes(theme)?0:1)||(a.photo?0:1)-(b.photo?0:1));if(pool[0])picks.push(pool[0]);if(layer==='edge'&&pool[1])picks.push(pool[1]);});}
 if(!picks.some(p=>p.layer==='field')){const f=allLib().find(x=>x.layer==='field'&&x.tags.includes(theme))||allLib().find(x=>x.layer==='field');if(f)picks.unshift(f)}
 const ls=picks.map(p=>hex2l(p.hex)),spread=ls.length?Math.max(...ls)-Math.min(...ls):0;
 const holds=picks.map(p=>({p,h:hold(p,place)})).sort((a,b)=>a.h-b.h),weak=holds[0];
 let score=84; if(spread<.22)score-=16; if(weak&&weak.h<hours)score-=18; if(light==='led'&&picks.some(p=>/金|绸|silk/.test(p.zh+p.id)))score-=10; if(place==='sun'&&picks.some(p=>p.heat<=2))score-=12;
 const missing=['field','focal','live'].filter(l=>!picks.some(p=>p.layer===l)); score=Math.max(28,Math.min(96,score-missing.length*8));
 renderBoard({theme,picks,spread,weak,hours,light,prompt,score,missing});
}
function photoList(R){const list=[]; R.picks.map(p=>p.photo).concat((THEME[R.theme]||THEME.pearl).photos).forEach(k=>{if(k&&!list.includes(k))list.push(k)}); return list}
function renderBoard(R){
 const th=THEME[R.theme]||THEME.pearl, title=(R.prompt&&R.prompt.length<16)?R.prompt:th.title, photos=photoList(R);
 let html=`<div class="kicker">${th.kicker}</div><div class="ttl">${esc(title)}</div><div class="sub">${['field','mass','focal','edge','light','live'].filter(l=>R.picks.some(p=>p.layer===l)).map(l=>LAY[l]).join(' · ')}</div>`;
 SLOTS.forEach((s,i)=>{const url=src(photos[i]); html+=`<div class="slot" style="left:${s.x}%;top:${s.y}%;width:${s.w}%;height:${s.h}%">${url?`<img src="${url}" alt="">`:`<div style="width:100%;height:100%;background:${(R.picks[i]||{}).hex||'#333'}"></div>`}</div>`});
 html+=`<div class="swatches">${R.picks.slice(0,5).map(p=>`<i style="background:${p.hex}"></i>`).join('')}</div><div class="legend">Lookset</div>`;
 const el=$('board'); el.style.background=th.ground; el.innerHTML=html;
 const notes=[]; if(R.spread<.22)notes.push('明度太近，四米外会糊。'); else notes.push('明度跨度够，远看有形状。');
 if(R.weak&&R.weak.h<R.hours)notes.push(R.weak.p.zh+'大约撑 '+R.weak.h.toFixed(1)+' h，短于现场 '+R.hours+' h。'); else if(R.weak)notes.push('最弱的是 '+R.weak.p.zh+'，还能撑过这场。');
 if(R.light==='led')notes.push('场地 4000K 会把金和绸写脏。');
 if(R.missing.length)notes.push('缺层：'+R.missing.map(l=>LAY[l]).join('、'));
 notes.push('四米外先读到的是布和幕，不是花。');
 $('meta').innerHTML=`<div class="scoreline"><span>结构</span><b>${R.score}</b></div>${notes.map(n=>`<div class="note">· ${n}</div>`).join('')}<details style="margin-top:10px"><summary>这一板怎么组的</summary><p>先锁布和光，再放主视觉，最后才是花。</p></details><div class="actions"><button onclick="window.print()">打印这张板</button><button id="btnAgain">换一套同氛围</button></div>`;
 $('btnAgain').onclick=()=>{BASE.push(BASE.shift());compose()};
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawLib(){$('lib').innerHTML=allLib().map(x=>{const bg=x.photo&&src(x.photo)?`url('${src(x.photo)}')`:x.hex;return `<div class="tile ${selected.has(x.id)?'on':''}" data-id="${x.id}"><span class="sw" style="background:${bg};background-size:cover"></span><div><b>${x.zh}</b><span>${LAY[x.layer]}</span></div></div>`}).join('')}
function drawPresets(){$('presets').innerHTML=PRESETS.map(p=>`<button data-id="${p.id}">${p.zh}</button>`).join('')}
load();drawPresets();drawLib();
$('mVibe').onclick=()=>{mode='vibe';$('mVibe').classList.add('on');$('mLib').classList.remove('on')};
$('mLib').onclick=()=>{mode='lib';$('mLib').classList.add('on');$('mVibe').classList.remove('on')};
$('presets').onclick=e=>{const id=e.target.dataset.id;if(!id)return;const p=PRESETS.find(x=>x.id===id);$('prompt').value=p.zh;[...$('presets').children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));compose()};
$('lib').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;if(selected.has(t.dataset.id))selected.delete(t.dataset.id);else selected.add(t.dataset.id);save();drawLib()};
$('btnAdd').onclick=()=>{const zh=$('nName').value.trim();if(!zh)return;custom.push({id:'c'+Date.now(),zh,layer:$('nLayer').value,hex:$('nHex').value,tags:($('nTags').value||'').split(',').map(s=>s.trim()).filter(Boolean),heat:4,photo:null});selected.add(custom.at(-1).id);save();drawLib();$('nName').value=''};
$('btnGo').onclick=compose;$('prompt').value='珍珠纯爱';compose();
</script></body></html>
